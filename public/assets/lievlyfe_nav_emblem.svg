<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <!-- Red bolt gradient -->
    <linearGradient id="redGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="85%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>

    <!-- Silver/Dark Chrome wing gradient for light backgrounds -->
    <linearGradient id="silverGrad2" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Red Bolt -->
  <g filter="url(#subtleGlow)">
    <polygon points="12,61 142,6 104,42 165,48 116,94 92,71 61,94" fill="url(#redGrad2)" />
    <polyline points="12,61 142,6 104,42" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wing -->
  <g filter="url(#subtleGlow)">
    <path d="M 138,13 Q 235,5 318,19 Q 225,44 153,62 L 186,28 Z" fill="url(#silverGrad2)" stroke="#475569" stroke-width="0.8" stroke-opacity="0.4" />
  </g>
</svg>